name: Refresh activity card

on:
  schedule:
    - cron: "17 0 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render the last 12 weeks of the contribution calendar
        run: python3 scripts/activity.py assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-*.svg
          git commit -m "chore: refresh activity card" || exit 0
          git push
